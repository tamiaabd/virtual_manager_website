<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Excel import in four steps</title>
  <desc id="d">Choose your Excel workbook, match its columns to the app's fields, preview and fix highlighted rows, then save. The original file stays unchanged.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#E2E8F0" stroke-width="2">
    <rect x="12" y="12" width="164" height="236" rx="16"/>
    <rect x="202" y="12" width="164" height="236" rx="16"/>
    <rect x="392" y="12" width="164" height="236" rx="16"/>
    <rect x="582" y="12" width="164" height="236" rx="16"/>
  </g>
  <g stroke="#94A3B8" stroke-width="2" marker-end="url(#ah)">
    <path d="M178 110 H198"/><path d="M368 110 H388"/><path d="M558 110 H578"/>
  </g>
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="36" cy="36" r="12" fill="#2563EB"/><text x="36" y="40">1</text>
    <circle cx="226" cy="36" r="12" fill="#2563EB"/><text x="226" y="40">2</text>
    <circle cx="416" cy="36" r="12" fill="#2563EB"/><text x="416" y="40">3</text>
    <circle cx="606" cy="36" r="12" fill="#2563EB"/><text x="606" y="40">4</text>
  </g>

  <!-- 1 Spreadsheet -->
  <rect x="38" y="62" width="112" height="96" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <path d="M38 68 a6 6 0 0 1 6 -6 h100 a6 6 0 0 1 6 6 v14 h-112 z" fill="#16A34A"/>
  <g stroke="#86EFAC" stroke-width="1.5">
    <path d="M38 101 H150 M38 120 H150 M38 139 H150"/><path d="M75 82 V158 M112 82 V158"/>
  </g>
  <text x="94" y="196" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Pick your sheet</text>
  <text x="94" y="216" font-size="12" fill="#475569" text-anchor="middle">.xlsx workbook</text>

  <!-- 2 Mapping -->
  <g font-size="11" font-weight="600" text-anchor="middle">
    <rect x="216" y="64" width="64" height="24" rx="6" fill="#F1F5F9"/><text x="248" y="80" fill="#334155">Product</text>
    <rect x="296" y="64" width="56" height="24" rx="6" fill="#DBEAFE"/><text x="324" y="80" fill="#1D4ED8">Item</text>
    <rect x="216" y="98" width="64" height="24" rx="6" fill="#F1F5F9"/><text x="248" y="114" fill="#334155">Sale Price</text>
    <rect x="296" y="98" width="56" height="24" rx="6" fill="#DBEAFE"/><text x="324" y="114" fill="#1D4ED8">Rate</text>
    <rect x="216" y="132" width="64" height="24" rx="6" fill="#F1F5F9"/><text x="248" y="148" fill="#334155">Party</text>
    <rect x="296" y="132" width="56" height="24" rx="6" fill="#DBEAFE"/><text x="324" y="148" fill="#1D4ED8">Customer</text>
  </g>
  <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M282 76 H293 M289 72 L293 76 L289 80"/><path d="M282 110 H293 M289 106 L293 110 L289 114"/><path d="M282 144 H293 M289 140 L293 144 L289 148"/>
  </g>
  <text x="284" y="196" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Match columns</text>
  <text x="284" y="216" font-size="12" fill="#475569" text-anchor="middle">Suggested, editable</text>

  <!-- 3 Preview -->
  <g fill="#F8FAFC" stroke="#E2E8F0">
    <rect x="410" y="62" width="128" height="18" rx="3"/><rect x="410" y="84" width="128" height="18" rx="3"/>
    <rect x="410" y="128" width="128" height="18" rx="3"/><rect x="410" y="150" width="128" height="18" rx="3"/>
  </g>
  <rect x="410" y="106" width="128" height="18" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="527" cy="115" r="6" fill="#F59E0B"/>
  <rect x="526" y="111" width="2" height="5" fill="#fff"/><rect x="526" y="117.5" width="2" height="2" fill="#fff"/>
  <g fill="#CBD5E1"><rect x="416" y="69" width="40" height="4" rx="2"/><rect x="416" y="91" width="52" height="4" rx="2"/><rect x="416" y="135" width="46" height="4" rx="2"/><rect x="416" y="157" width="36" height="4" rx="2"/></g>
  <rect x="416" y="113" width="48" height="4" rx="2" fill="#D97706"/>
  <text x="474" y="196" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Preview &amp; fix</text>
  <text x="474" y="216" font-size="12" fill="#475569" text-anchor="middle">Nothing saved yet</text>

  <!-- 4 Saved -->
  <circle cx="664" cy="112" r="40" fill="#DCFCE7"/>
  <circle cx="664" cy="112" r="28" fill="#16A34A"/>
  <path d="M651 112 L660 121 L678 103" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="664" y="196" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Save records</text>
  <text x="664" y="216" font-size="12" fill="#475569" text-anchor="middle">Workbook unchanged</text>
</svg>
