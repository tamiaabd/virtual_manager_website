  <rect x="78" y="246" width="12" height="14" rx="2" fill="#2563EB"/><rect x="95" y="238" width="12" height="22" rx="2" fill="#2563EB"/>
  <rect x="112" y="230" width="12" height="30" rx="2" fill="#16A34A"/><rect x="129" y="242" width="12" height="18" rx="2" fill="#2563EB"/>
