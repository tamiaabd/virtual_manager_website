<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Offline first, with optional cloud sync</title>
  <desc id="d">A shop computer, the owner's phone and a staff phone each work offline and save records on the device. When cloud sync is turned on, they sync through the cloud. The staff phone has limited access.</desc>

  <!-- Connection lines -->
  <g fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round">
    <path d="M128 192 C150 140 250 118 300 112"/>
    <path d="M360 180 L360 136"/>
    <path d="M592 180 C570 140 470 118 420 112"/>
  </g>
  <g fill="#fff" stroke="#2563EB" stroke-width="2">
    <circle cx="205" cy="138" r="13"/><circle cx="360" cy="158" r="13"/><circle cx="515" cy="138" r="13"/>
  </g>
  <g fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round">
