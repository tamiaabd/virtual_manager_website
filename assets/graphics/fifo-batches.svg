<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">How FIFO costs a sale</title>
  <desc id="d">Batch A has 10 bags at Rs 100 and Batch B has 10 bags at Rs 120. A sale of 12 bags uses all 10 bags from Batch A and 2 from Batch B, so the cost of stock sold is Rs 1,240 and 8 bags remain in Batch B.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Batch A -->
  <rect x="24" y="24" width="320" height="150" rx="16" fill="#fff" stroke="#BFDBFE" stroke-width="2"/>
  <text x="44" y="56" font-size="12" font-weight="700" letter-spacing="1" fill="#2563EB">BATCH A · BOUGHT FIRST</text>
  <text x="44" y="86" font-size="21" font-weight="800" fill="#1E293B">10 bags × Rs 100</text>
  <g fill="#2563EB">
    <rect x="44" y="104" width="24" height="24" rx="5"/><rect x="72" y="104" width="24" height="24" rx="5"/>
    <rect x="100" y="104" width="24" height="24" rx="5"/><rect x="128" y="104" width="24" height="24" rx="5"/>
    <rect x="156" y="104" width="24" height="24" rx="5"/><rect x="184" y="104" width="24" height="24" rx="5"/>
    <rect x="212" y="104" width="24" height="24" rx="5"/><rect x="240" y="104" width="24" height="24" rx="5"/>
    <rect x="268" y="104" width="24" height="24" rx="5"/><rect x="296" y="104" width="24" height="24" rx="5"/>
  </g>
  <text x="44" y="154" font-size="13" fill="#475569">All 10 bags are used first</text>

  <!-- Batch B -->
  <rect x="376" y="24" width="320" height="150" rx="16" fill="#fff" stroke="#FED7AA" stroke-width="2"/>
  <text x="396" y="56" font-size="12" font-weight="700" letter-spacing="1" fill="#EA580C">BATCH B · BOUGHT LATER</text>
  <text x="396" y="86" font-size="21" font-weight="800" fill="#1E293B">10 bags × Rs 120</text>
  <g fill="#EA580C">
    <rect x="396" y="104" width="24" height="24" rx="5"/><rect x="424" y="104" width="24" height="24" rx="5"/>
  </g>
  <g fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5">
    <rect x="452" y="104.75" width="22.5" height="22.5" rx="5"/><rect x="480" y="104.75" width="22.5" height="22.5" rx="5"/>
    <rect x="508" y="104.75" width="22.5" height="22.5" rx="5"/><rect x="536" y="104.75" width="22.5" height="22.5" rx="5"/>
    <rect x="564" y="104.75" width="22.5" height="22.5" rx="5"/><rect x="592" y="104.75" width="22.5" height="22.5" rx="5"/>
    <rect x="620" y="104.75" width="22.5" height="22.5" rx="5"/><rect x="648" y="104.75" width="22.5" height="22.5" rx="5"/>
  </g>
  <text x="396" y="154" font-size="13" fill="#475569">2 bags used · 8 bags still in stock</text>

  <!-- Flow to sale -->
  <path d="M184 176 C184 214 260 236 266 248" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M536 176 C536 214 460 236 454 248" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="266" y="232" width="188" height="42" rx="21" fill="#1E293B"/>
  <text x="360" y="259" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Sale: 12 bags</text>
  <path d="M360 276 L360 298" stroke="#94A3B8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Result -->
  <rect x="24" y="304" width="672" height="84" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="48" y="336" font-size="12" font-weight="700" letter-spacing="1" fill="#16A34A">COST OF STOCK SOLD</text>
  <text x="48" y="366" font-size="19" font-weight="800" fill="#14532D">10 × Rs 100 + 2 × Rs 120 = Rs 1,240</text>
  <text x="672" y="336" font-size="12" font-weight="700" letter-spacing="1" fill="#16A34A" text-anchor="end">STILL IN STOCK</text>
  <text x="672" y="366" font-size="17" font-weight="700" fill="#14532D" text-anchor="end">8 bags at Rs 120</text>
</svg>
